name: tests

on:
  push:
    branches:
      - '**'
    tags:
      - '!**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:

  backend:

    services:
      mysql:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    strategy:
      matrix:
        python-version: [3.11, 3.12, 3.13]

    runs-on: ubuntu-latest
    name: Python ${{ matrix.python-version }}
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install poetry
      run: |
        pipx install poetry
    - name: Capture uWSGI failure details
      continue-on-error: true
      run: |
        set +e
        python -m pip wheel \
          --no-cache-dir \
          --no-binary uwsgi \
          --use-pep517 \
          "uwsgi==2.0.31" \
          -v 2>&1 | tee uwsgi-build-before-system-deps.log
        status=${PIPESTATUS[0]}

        echo "uWSGI build exit code: $status"
        echo "::group::Compiler and linker errors"
        grep -Ei \
          'error:|fatal error:|undefined reference|cannot find|ld returned|error linking|collect2' \
          uwsgi-build-before-system-deps.log || true
        echo "::endgroup::"

        echo "::group::Relevant system packages before fix"
        dpkg-query -W -f='${Package} ${Version}\n' \
          build-essential gcc libc6-dev libpcre3-dev libssl-dev \
          zlib1g-dev libxml2-dev libxslt1-dev 2>&1 || true
        echo "::endgroup::"

        exit 0

    - name: Install native build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libpcre3-dev \
          libssl-dev \
          zlib1g-dev \
          libxml2-dev \
          libxslt1-dev
    - name: Debug uWSGI build
      run: |
        poetry --version
        poetry show uwsgi || true
        python -m pip wheel --no-cache-dir --use-pep517 "uwsgi==2.0.31" -v
    - name: Install dependencies
      run: |
        poetry install -vvv
        poetry run pip install -r requirements_dev.txt
    - name: Set MySQL mode
      env:
        DB_HOST: 127.0.0.1
        DB_PORT: ${{ job.services.mysql.ports[3306] }}
      run: |
        mysql --host $DB_HOST --port $DB_PORT -uroot -proot -e "SET GLOBAL sql_mode = 'NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION'";
    - name: Lint files
      run: |
        poetry run ruff check --output-format=github
    - name : Check format
      run: |
        poetry run ruff format --diff
    - name: Tests
      run: |
        poetry run pytest -s

  frontend:

    strategy:
      matrix:
        node-version: [20.x]

    runs-on: ubuntu-latest
    name: Node ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        working-directory: ./ui
        run: yarn install
      - name: Run ESLint
        working-directory: ./ui
        run: yarn lint
      - name: Check format
        working-directory: ./ui
        run: yarn format:check
      - name: Run unit tests
        working-directory: ./ui
        run: yarn test:unit
